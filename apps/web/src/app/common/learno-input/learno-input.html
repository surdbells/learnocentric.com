<label class="form-label" for="{{id()}}">{{label()}}</label>
<input
    class="form-control"
    id="{{id()}}"
    type="{{inputType()}}"
    [attr.placeholder]="placeholder() || null"
    [value]="value()"
    (input)="onInput($event)"
    (change)="onInput($event)"
    (blur)="onBlur()"
    [disabled]="disabled() || cvaDisabled()"
/>
