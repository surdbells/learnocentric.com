<div class="live-room-overlay">
  <div class="live-room-bar">
    <div class="d-flex align-items-center gap-2 text-white">
      <app-icon name="videocam" />
      <span class="fw-semibold">{{ title }}</span>
      @if (connecting()) { <span class="small opacity-75">connecting…</span> }
    </div>
    <div class="d-flex align-items-center gap-2">
      @if (isStudent) {
        <a routerLink="/student/report-concern" class="btn btn-sm btn-outline-light" title="Report a safeguarding concern">
          <app-icon name="health_and_safety" [size]="18" class="me-1" /> Report a concern
        </a>
      }
      <button type="button" class="btn btn-sm btn-danger" (click)="leave()">Leave class</button>
    </div>
  </div>

  <div class="live-room-stage">
    @if (error()) {
      <div class="live-room-message">
        <app-icon name="error" [size]="32" class="mb-2" />
        <div>{{ error() }}</div>
        <button type="button" class="btn btn-light mt-3" (click)="leave()">Close</button>
      </div>
    }
    <div #callContainer class="live-room-frame"></div>
  </div>
</div>
