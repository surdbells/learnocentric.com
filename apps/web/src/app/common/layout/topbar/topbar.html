<div class="tb-inner">
  <!-- Left: nav toggles + title -->
  <div class="tb-left">
    <!-- Mobile: open drawer -->
    <button type="button" class="tb-icon-btn d-lg-none" (click)="openMobile.emit()" aria-label="Open menu">
      <app-icon name="menu" />
    </button>
    <!-- Desktop: collapse/expand rail -->
    <button type="button" class="tb-icon-btn d-none d-lg-inline-flex" (click)="toggleSidebar.emit()"
            [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <app-icon [name]="collapsed() ? 'menu_open' : 'menu'" />
    </button>

    <button type="button" class="tb-icon-btn tb-back" (click)="goBack()" aria-label="Go back">
      <app-icon name="arrow_back" />
    </button>

    <h1 class="tb-title">{{ pageTitle() }}</h1>
  </div>

  <!-- Center: global search -->
  <div class="tb-search">
    <div class="tb-search-box">
      <app-icon name="search" [size]="18" class="tb-search-ic" />
      <input type="text" class="tb-search-input" placeholder="Search lessons, topics, assessments…"
             [ngModel]="query()" (ngModelChange)="onSearch($event)" (focus)="focusSearch()" (blur)="blurSearch()"
             autocomplete="off" aria-label="Search" />
      @if (searching()) { <span class="tb-search-spin"></span> }
    </div>

    @if (showResults() && query().trim().length >= 2) {
      <div class="tb-search-results">
        @if (searching() && !results().length) {
          <div class="tb-search-empty">Searching…</div>
        } @else if (!results().length) {
          <div class="tb-search-empty">No results for "{{ query() }}"</div>
        } @else {
          @for (r of results(); track $index) {
            <button type="button" class="tb-search-item" (mousedown)="selectResult(r)">
              <span class="tb-search-item-ic"><app-icon [name]="r.icon" [size]="16" /></span>
              <span class="tb-search-item-body">
                <span class="tb-search-item-title">{{ r.title }}</span>
                <span class="tb-search-item-sub">{{ r.subtitle }}</span>
              </span>
              <span class="tb-search-item-type">{{ r.type }}</span>
            </button>
          }
        }
      </div>
    }
  </div>

  <!-- Right: preferences + user -->
  <div class="tb-right">
    <app-term-switcher class="d-none d-md-inline-flex me-1" />

    <button type="button" class="tb-icon-btn" (click)="toggleTheme()"
            [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
            [attr.title]="isDark() ? 'Light mode' : 'Dark mode'">
      <app-icon [name]="isDark() ? 'light_mode' : 'dark_mode'" />
    </button>

    <app-notification-bell/>

    <div class="dropdown tb-prefs" preferenceSetting></div>

    <div class="dropdown">
      <button type="button" class="tb-user" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
        <span class="tb-avatar">
          <img class="tb-avatar-img" [src]="avatar()" alt="Profile" />
        </span>
        <span class="tb-user-meta d-none d-sm-flex">
          <span class="tb-user-name">{{ user()?.firstName }} {{ user()?.lastName }}</span>
          <span class="tb-user-role">{{ user()?.role }}</span>
        </span>
        <app-icon name="expand_more" class="tb-user-caret d-none d-sm-inline" />
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li (click)="signOut()">
          <a class="dropdown-item d-flex align-items-center gap-2" role="button">
            <app-icon name="logout" /> Sign out
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
