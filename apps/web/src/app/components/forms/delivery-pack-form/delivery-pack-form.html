<form (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="modal-body">
    <div class="row">
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="dp_topic">Topic</label>
        @if (isEdit()) {
          <input class="form-control" [value]="editTopicTitle()" disabled/>
        } @else {
          <select id="dp_topic" class="form-select" formControlName="topicId">
            <option [ngValue]="null" disabled>Select a topic</option>
            @for (t of availableTopics(); track t.id) {
              <option [ngValue]="t.id">{{ t.title }}{{ t.subject ? ' · ' + t.subject : '' }}</option>
            }
          </select>
          @if (!availableTopics().length) {
            <div class="form-text">Every published topic already has a pack.</div>
          }
        }
      </div>

      <div class="col-lg-12 mb-2"><span class="badge bg-success-subtle text-success">Learner-facing</span></div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="dp_note">Lesson note</label>
        <textarea id="dp_note" class="form-control" rows="4" formControlName="learnerNote" placeholder="Explain the topic in clear, student-friendly language…"></textarea>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="dp_video">Lesson media</label>
        <input id="dp_video" type="url" class="form-control mb-2" formControlName="videoUrl" placeholder="Paste a YouTube/Vimeo or file URL…"/>
        <app-file-upload
          [value]="form.get('videoUrl')!.value || null"
          label="…or upload a video, audio, PDF or image"
          hint="Students see it embedded in the lesson"
          (uploaded)="onMediaUploaded($event)"
          (cleared)="onMediaCleared()"
        />
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="dp_worked">Worked examples</label>
        <textarea id="dp_worked" class="form-control" rows="2" formControlName="workedExamples"></textarea>
      </div>

      <div class="col-lg-12 mb-2"><span class="badge bg-secondary-subtle text-secondary">Staff / parent (not shown to students)</span></div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="dp_guide">Teacher guide</label>
        <textarea id="dp_guide" class="form-control" rows="3" formControlName="teacherGuide" placeholder="How to deliver this lesson…"></textarea>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="dp_parent">Parent wording</label>
        <textarea id="dp_parent" class="form-control" rows="3" formControlName="parentWording" placeholder="Plain-language note for parents…"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <a class="btn btn-light" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="isEdit() ? 'Update Pack' : 'Create Pack'"/>
  </div>
</form>
