<form (submit)="onEdit()"  [formGroup]="form" >
  <div class="modal-body" data-select2-id="83">
    <div class="row" data-select2-id="82">

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'firstName'" id="firstName" label="Firstname"></div>
      </div>

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'lastName'" id="lastName" label="Lastname"></div>
      </div>

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'email'" id="email" label="Email"></div>
      </div>

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="date" [formControlName]="'dateOfBirth'" id="dateOfBirth" label="Date of Birth"></div>
      </div>

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'phone'" id="phone" label="Phone"></div>
      </div>

      <div class="col-lg-12">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="isActive" [formControlName]="'isActive'">
          <label class="form-check-label" for="isActive">Active</label>
        </div>
      </div>

    </div>

    @if (select()['id']) {
      <div class="border rounded-3 p-3 mt-3" (keydown.enter)="$event.preventDefault()">
        <div class="fw-semibold mb-1">Can't sign in?</div>
        <div class="small text-body-secondary mb-2">Set a temporary password and share it with them. They can change it after signing in, or use “Forgot password” on the sign-in page.</div>
        <div class="d-flex gap-2" style="max-width: 420px;">
          <input type="text" class="form-control form-control-sm" placeholder="Temporary password" autocomplete="off" aria-label="Temporary password"
                 [ngModel]="tempPassword()" (ngModelChange)="tempPassword.set($event)" [ngModelOptions]="{standalone: true}" />
          <button type="button" class="btn btn-sm btn-outline-success text-nowrap" [disabled]="settingPassword()" (click)="setPassword()">Set password</button>
        </div>
      </div>
    }
    @if (guardians()) { <app-student-guardians class="d-block mt-3" [studentId]="select()['id']" /> }
  </div>
  <div class="modal-footer">
    <a href="#" #closebtn  class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="'Submit'" />
<!--    <button type="submit" class="btn btn-primary">Add Time Table</button>-->
  </div>
</form>
