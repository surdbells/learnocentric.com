<form [formGroup]="form" (submit)="isEdit() ? onEdit() : onSubmit()">
  <div learnoInput class="mb-4" [label]="'Institution Name'" [inputType]="'text'" [id]="'institutionName'" [formControlName]="'institutionName'"></div>
  <div learnoSelect [placeHolder]="'Institution Type'" class="mb-4" [label]="'Institution Type'" [id]="'institutionType'" [formControlName]="'institutionType'" [options]="typeOptions"></div>

  <div class="row">
    <div class="col-md-6">
      <div learnoInput class="mb-4" [label]="'Admin Email'" [inputType]="'email'" [id]="'adminEmail'" [formControlName]="'adminEmail'"></div>
    </div>
    <div class="col-md-6">
      <div learnoInput class="mb-4" [label]="'Admin Password'" [inputType]="'password'" [id]="'adminPassword'" [formControlName]="'adminPassword'"></div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div learnoInput class="mb-4" [label]="'Admin First Name'" [inputType]="'text'" [id]="'adminFirstName'" [formControlName]="'adminFirstName'"></div>
    </div>
    <div class="col-md-6">
      <div learnoInput class="mb-4" [label]="'Admin Last Name'" [inputType]="'text'" [id]="'adminLastName'" [formControlName]="'adminLastName'"></div>
    </div>
  </div>

  <div learnoInput class="mb-4" [label]="'Address'" [inputType]="'text'" [id]="'address'" [formControlName]="'address'"></div>
  <div learnoInput class="mb-4" [label]="'Phone'" [inputType]="'text'" [id]="'phone'" [formControlName]="'phone'"></div>

  <div class="row">


  </div>

  <div class="row">
    <div class="col-md-6">
      <label class="form-label" for="logoFile">Upload Logo</label>
      <input id="logoFile" type="file" class="form-control" accept="image/*" (change)="onLogoFileSelected($event)" [disabled]="logoUploading()" />
      @if (logoPreviewUrl()) {
        <div class="logo-preview mt-2" style="width: 70px; height: 70px;">
          <img [src]="logoPreviewUrl()" alt="Logo Preview" class="img-fluid rounded" />
        </div>
      }
      @if (logoUploading()) {
        <div class="mt-2">
          <div class="d-flex justify-content-between small text-body-secondary"><span>Uploading…</span><span class="fw-semibold">{{ uploadProgress() ?? 0 }}%</span></div>
          <div class="progress" style="height:6px"><div class="progress-bar bg-success" [style.width.%]="uploadProgress() ?? 0"></div></div>
        </div>
      }
    </div>
    <div class="col-md-6">
      <div learnoInput class="" [label]="'Primary Color'" [inputType]="'color'" [id]="'primaryColor'" [formControlName]="'primaryColor'"></div>
    </div>
  </div>

  <div learnoSelect class="mb-4" [placeHolder]="'Package'" [label]="'Content Packages'" [id]="'packageIds'" [formControlName]="'packageIds'" [options]="packageOptions()" [searchable]="true" [multiple]="true"></div>

  @if(isEdit()){
    <div class="mb-4">
      <label class="form-label" for="isActiveSwitch">Status</label>
      <div class="d-flex align-items-center">
        <div class="form-check form-switch me-3">
          <input class="form-check-input" type="checkbox" id="isActiveSwitch" [formControlName]="'isActive'" />
          <label class="form-check-label" for="isActiveSwitch">Activate</label>
        </div>
        <span [class]="(form.get('isActive')?.value ? 'badge bg-success-subtle text-success' : 'badge bg-danger-subtle text-danger')">
          {{ form.get('isActive')?.value ? 'Active' : 'Suspended' }}
        </span>
      </div>
    </div>
  }

  @if(isEdit()){
      <div class="modal-footer">
          <a #closebtn class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
          <app-learno-button [isLoading]="isLoading()" [text]="'Update'" />
      </div>
  }@else{
      <app-learno-button class="mt-3" [text]="'Onboard'" [isLoading]="isLoading()" />
  }
</form>
