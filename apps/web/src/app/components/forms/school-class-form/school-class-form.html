<form (submit)="!isEdit() ? onSubmit(): onEdit()" [formGroup]="form" >
  <div class="modal-body">
    <div class="row">

      <div class="col-md-6">
        <div learnoInput class="mb-3" [label]="'Level'" [inputType]="'text'" [id]="'gradeLevel'" [formControlName]="'gradeLevel'" [placeholder]="'e.g. ' + levelExamples"></div>
        <div class="d-flex flex-wrap gap-1 mb-3" aria-label="Suggested levels">
          @for (lvl of levels; track lvl) {
            <button type="button" class="btn btn-sm btn-outline-secondary py-0" (click)="form.controls.gradeLevel.setValue(lvl)">{{ lvl }}</button>
          }
        </div>
      </div>
      <div class="col-md-6">
        <div learnoInput class="mb-3" [label]="'Arm / Section (optional)'" [inputType]="'text'" [id]="'section'" [formControlName]="'section'" [placeholder]="'e.g. A, B, Gold'"></div>
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label" for="classTeacherId">Class teacher (optional)</label>
        <select id="classTeacherId" class="form-select" formControlName="classTeacherId">
          <option [ngValue]="null">No class teacher</option>
          @for (t of teachers(); track t.id) { <option [ngValue]="t.id">{{ t.name }}</option> }
        </select>
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label" for="classStatus">Status</label>
        <select id="classStatus" class="form-select" formControlName="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive (closed)</option>
        </select>
        <div class="form-text">An inactive class keeps its records but takes no new enrolments and leaves teachers' class lists.</div>
      </div>

      <div class="col-12">
        <div class="alert alert-light border small mb-0">
          The class will be named from the level and arm — e.g. <strong>{{ previewName || 'JSS 1 A' }}</strong>. Use the arm for streams like A/B or Gold/Silver, not a subject.
        </div>
      </div>

    </div>
  </div>
  <div class="modal-footer">
    <a #closebtn class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="'Submit'" />
  </div>
</form>
