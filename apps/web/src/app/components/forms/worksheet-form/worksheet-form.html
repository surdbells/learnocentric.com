<form (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="modal-body">
    <div class="row">
      <div class="col-lg-8">
        <div learnoInput class="mb-3" [label]="'Worksheet title'" [inputType]="'text'" [id]="'w_title'" [formControlName]="'title'"></div>
      </div>
      <div class="col-lg-4">
        <div learnoInput class="mb-3" [label]="'Total marks'" [inputType]="'number'" [id]="'w_marks'" [formControlName]="'totalMarks'"></div>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="w_topic">Topic</label>
        <select id="w_topic" class="form-select" formControlName="topicId">
          <option [ngValue]="null" disabled>Select a topic</option>
          @for (t of topicList(); track t.id) {
            <option [ngValue]="t.id">{{ t.title }}{{ t.subject ? ' · ' + t.subject : '' }}</option>
          }
        </select>
      </div>
      <div class="col-lg-3 mb-3">
        <label class="form-label" for="w_track">Track</label>
        <select id="w_track" class="form-select" formControlName="track">
          <option value="academic">Academic performance</option>
          <option value="competency">Competency transfer</option>
        </select>
      </div>
      <div class="col-lg-3">
        <div learnoInput class="mb-3" [label]="'Due date'" [inputType]="'date'" [id]="'w_due'" [formControlName]="'dueDate'"></div>
      </div>
      <div class="col-lg-12">
        <div learnoInput class="mb-3" [label]="'Instructions'" [inputType]="'text'" [id]="'w_instr'" [formControlName]="'instructions'"></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <a class="btn btn-light" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="isEdit() ? 'Update Worksheet' : 'Add Worksheet'"/>
  </div>
</form>
