<form (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="modal-body">
    <div class="row">
      <div class="col-lg-8">
        <div learnoInput class="mb-3" [label]="'Topic title'" [inputType]="'text'" [id]="'t_title'" [formControlName]="'title'"></div>
      </div>
      <div class="col-lg-4">
        <div learnoInput class="mb-3" [label]="'Week'" [inputType]="'number'" [id]="'t_week'" [formControlName]="'weekNumber'"></div>
      </div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="t_subject">Subject</label>
        <select id="t_subject" class="form-select" formControlName="subjectId">
          <option [ngValue]="null" disabled>Select a subject</option>
          @for (s of subjects(); track s.id) {
            <option [ngValue]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="t_obj">Learning objective</label>
        <app-rich-editor formControlName="objective" placeholder="List the lesson's objectives — use bullets or numbering…" />
      </div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="t_rl">Real-life relevance</label>
        <app-rich-editor formControlName="realLifeRelevance" placeholder="Why this matters in the real world — bullets welcome…" />
      </div>
      <div class="col-lg-6">
        <div learnoInput class="mb-3" [label]="'Competency built'" [inputType]="'text'" [id]="'t_cb'" [formControlName]="'competencyBuilt'"></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <a class="btn btn-light" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="isEdit() ? 'Update Topic' : 'Add Topic'"/>
  </div>
</form>
