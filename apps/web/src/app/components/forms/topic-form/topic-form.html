<form (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="modal-body">
    <div class="row">
      <div class="col-lg-8">
        <div learnoInput class="mb-3" [label]="'Topic title'" [inputType]="'text'" [id]="'t_title'" [formControlName]="'title'"></div>
      </div>
      <div class="col-lg-4">
        <div learnoInput class="mb-3" [label]="'Week'" [inputType]="'number'" [id]="'t_week'" [formControlName]="'weekNumber'"></div>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="t_subject">Subject</label>
        <select id="t_subject" class="form-select" formControlName="subjectId">
          <option [ngValue]="null" disabled>Select a subject</option>
          @for (s of subjects(); track s.id) {
            <option [ngValue]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="t_class">Class</label>
        <select id="t_class" class="form-select" formControlName="classId">
          <option [ngValue]="null">All classes</option>
          @for (c of classes(); track c.id) {
            <option [ngValue]="c.id">{{ c.label }}</option>
          }
        </select>
        <div class="form-text">Leave as "All classes" to show it to every class taking the subject, or pick one class to target it.</div>
      </div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="t_obj">Learning objective</label>
        <app-rich-editor formControlName="objective" placeholder="List the lesson's objectives — use bullets or numbering…" />
      </div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="t_rl">Real-life relevance</label>
        <app-rich-editor formControlName="realLifeRelevance" placeholder="Why this matters in the real world — bullets welcome…" />
      </div>
      <div class="col-lg-6">
        <div learnoInput class="mb-3" [label]="'Competency built'" [inputType]="'text'" [id]="'t_cb'" [formControlName]="'competencyBuilt'"></div>
      </div>
      <div class="col-lg-6">
        <div learnoInput class="mb-3" [label]="'Strand / theme'" [inputType]="'text'" [id]="'t_strand'" [formControlName]="'strand'"></div>
      </div>

      <!-- Teaching notes: shown in Insights, Analytics and the approval queue -->
      <div class="col-12"><div class="small text-uppercase fw-semibold text-body-secondary mb-2">Teaching notes (optional)</div></div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="t_pre">Prerequisites</label>
        <textarea id="t_pre" class="form-control" rows="2" formControlName="prerequisites" placeholder="What learners should already know"></textarea>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="t_work">Workplace relevance</label>
        <textarea id="t_work" class="form-control" rows="2" formControlName="workplaceRelevance" placeholder="Where this shows up in jobs and careers"></textarea>
      </div>
      <div class="col-lg-12 mb-3">
        <label class="form-label" for="t_core">Core theory</label>
        <textarea id="t_core" class="form-control" rows="3" formControlName="coreTheory" placeholder="The key ideas of this topic, in brief"></textarea>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="t_mis">Common misconceptions</label>
        <textarea id="t_mis" class="form-control" rows="3" formControlName="misconceptions" placeholder="One per line"></textarea>
        <div class="form-text">Mistakes learners often make; Insights compares them with wrong answers.</div>
      </div>
      <div class="col-lg-6 mb-3">
        <label class="form-label" for="t_qt">Question types</label>
        <textarea id="t_qt" class="form-control" rows="3" formControlName="questionTypes" placeholder="One per line, e.g. Word problems"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <a class="btn btn-light" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="isEdit() ? 'Update Topic' : 'Add Topic'"/>
  </div>
</form>
