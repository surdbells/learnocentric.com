
        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body p-3">
                <div class="row align-items-center">
                    <div class="col-12 col-lg-auto mb-3 mb-lg-0">
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <div class="text-body-secondary"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg"><div class="row gx-3  ">
                        <div class="col col-lg-auto ms-auto">
                            <div class="input-group bg-body">
                              <input type="text" class="form-control" placeholder="Search" aria-label="Search"
                                     aria-describedby="search" [(ngModel)]="searchValue"
                                     (input)="handleSearch()"/>
                              <span class="input-group-text" id="search">
        <app-icon name="search" />
      </span>
                            </div>
                        </div>
                      @if(filterKeys().length > 0){
                        <div class="col-auto">
                          <div class="dropdown">
                            <button class="btn btn-outline-secondary px-3" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                              <app-icon name="filter_list" />
                            </button>
                            <div class="dropdown-menu rounded-3 p-6">
                              <h4 class="fs-lg mb-4">Filter</h4>
                              <form style="width: 350px" id="filterForm">
                                <div class="row align-items-center mb-3">
                                  @for (filterKey of filterKeys(); track filterKey; let filterIndex = $index){
                                    <div class="col-3">
                                      <label class="form-label mb-0" for="filterCompany">{{filterKey}}</label>
                                    </div>


                                    <div class="col-9">
                                      <select class="form-select" id="filterCompany"   (change)="handleFilter($event)" >
                                        @for(filterValue of filterValues()[filterIndex]; track filterValue) {
                                          <option [value]="filterValue?.value">{{filterValue?.label}}</option>
                                        }
                                      </select>
                                    </div>
                                  }

                                </div>
                              </form>
                            </div>
                          </div>
                        </div>
                      }
                    </div>
                    </div>
                </div>
            </div>
        </div>
