@if (loading()) {
  <div class="text-body-secondary p-4">Loading…</div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h3 class="fs-5 mb-1 text-capitalize">{{ noun() }} details</h3>
        <p class="text-body-secondary mb-4">The name, type and address shown across the {{ noun() }}.</p>
        <div class="row">
          <div class="col-lg-8 mb-3" learnoInput [label]="'Name'" [inputType]="'text'" [id]="'sp_name'" [formControlName]="'name'"></div>
          <div class="col-lg-4 mb-3">
            <label class="form-label" for="sp_type">Type</label>
            <select id="sp_type" class="form-select" formControlName="type">
              <option value="school">School</option>
              <option value="academy">Academy</option>
            </select>
          </div>
          <div class="col-lg-12 mb-3" learnoInput [label]="'Address'" [inputType]="'text'" [id]="'sp_addr'" [formControlName]="'address'"></div>
        </div>
      </div>
    </section>

    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h3 class="fs-5 mb-1">Branding</h3>
        <p class="text-body-secondary mb-4">Your logo and brand colour.</p>
        <div class="row align-items-start">
          <div class="col-lg-4 mb-3">
            <label class="form-label" for="sp_color">Brand colour</label>
            <input id="sp_color" type="color" class="form-control form-control-color" formControlName="brandColor" title="Brand colour"/>
          </div>
          <div class="col-lg-8 mb-3">
            <label class="form-label d-block">Logo</label>
            <app-file-upload
              [value]="logoUrl()"
              label="Upload your logo (PNG or JPG)"
              accept="image/*"
              hint="A square image works best"
              (uploaded)="onLogoUploaded($event)"
              (cleared)="onLogoCleared()"
            />
          </div>
        </div>
      </div>
    </section>

    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h3 class="fs-5 mb-1">Primary contact</h3>
        <p class="text-body-secondary mb-4">Who we reach for account matters.</p>
        <div class="row">
          <div class="col-lg-4 mb-3" learnoInput [label]="'Contact name'" [inputType]="'text'" [id]="'sp_cname'" [formControlName]="'contactName'"></div>
          <div class="col-lg-4 mb-3" learnoInput [label]="'Contact email'" [inputType]="'email'" [id]="'sp_cemail'" [formControlName]="'contactEmail'"></div>
          <div class="col-lg-4 mb-3" learnoInput [label]="'Contact phone'" [inputType]="'text'" [id]="'sp_cphone'" [formControlName]="'contactPhone'"></div>
        </div>
      </div>
    </section>

    <div class="d-flex justify-content-end">
      <app-learno-button [isLoading]="saving()" [text]="'Save profile'"/>
    </div>
  </form>
}
