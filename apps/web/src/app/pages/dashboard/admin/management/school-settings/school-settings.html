<app-page-header icon="settings" action="School Settings"></app-page-header>

@if (loading()) {
  <div class="text-body-secondary p-4">Loading…</div>
} @else {
  <div class="row g-4">
    <!-- Grading policy -->
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h5 class="fw-semibold mb-1">Grading policy</h5>
          <p class="text-body-secondary mb-4">The pass mark and grade bands used across reports.</p>

          <div class="mb-4" style="max-width: 220px;">
            <label class="form-label" for="pass">Pass mark (%)</label>
            <input id="pass" type="number" min="0" max="100" class="form-control"
                   [ngModel]="passMark()" (ngModelChange)="passMark.set(+$event)"/>
          </div>

          <label class="form-label">Grade bands</label>
          <div class="d-flex flex-column gap-2">
            @for (b of bands(); track $index) {
              <div class="d-flex gap-2 align-items-center">
                <input class="form-control" style="max-width: 120px;" placeholder="Grade"
                       [ngModel]="b.grade" (ngModelChange)="setBand($index, {grade: $event})"/>
                <span class="text-body-secondary small">from</span>
                <input type="number" min="0" max="100" class="form-control" style="max-width: 110px;"
                       [ngModel]="b.min" (ngModelChange)="setBand($index, {min: +$event})"/>
                <span class="text-body-secondary small">%+</span>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeBand($index)" title="Remove">
                  <app-icon name="close" [size]="16" />
                </button>
              </div>
            }
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary mt-3" (click)="addBand()">+ Add band</button>
        </div>
      </div>
    </div>

    <!-- Safeguarding config -->
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h5 class="fw-semibold mb-1">Safeguarding</h5>
          <p class="text-body-secondary mb-4">The designated safeguarding lead and your policy note.</p>

          <div class="mb-3">
            <label class="form-label" for="dsl_name">Designated lead</label>
            <input id="dsl_name" class="form-control" [ngModel]="safeguarding().lead_name" (ngModelChange)="setSafe({lead_name: $event})"/>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="dsl_email">Lead email</label>
              <input id="dsl_email" type="email" class="form-control" [ngModel]="safeguarding().lead_email" (ngModelChange)="setSafe({lead_email: $event})"/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="dsl_phone">Lead phone</label>
              <input id="dsl_phone" class="form-control" [ngModel]="safeguarding().lead_phone" (ngModelChange)="setSafe({lead_phone: $event})"/>
            </div>
          </div>
          <div class="mb-0">
            <label class="form-label" for="dsl_note">Policy note</label>
            <textarea id="dsl_note" rows="4" class="form-control" [ngModel]="safeguarding().policy_note" (ngModelChange)="setSafe({policy_note: $event})"
                      placeholder="How concerns are handled at your school…"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-4">
    <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="save()">{{ saving() ? 'Saving…' : 'Save settings' }}</button>
  </div>
}
