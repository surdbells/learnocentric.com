<div class="row g-4">

    <!-- Left Column: Forms -->
    <div class="col-lg-8">
        <div class="checkout-card p-4 mb-4">
            <h4 class="mb-3">Order & Billing Details</h4>

            <!-- Subscription Summary -->
            <div class="form-section">
                <h5>Subscription</h5>
                <p class="mb-2"><strong>Plan:</strong> AI Ultimate – Yearly</p>
                <p class="mb-2"><strong>Price:</strong> $300</p>
                <p class="mb-0"><strong>Licenses:</strong> 1 User</p>
            </div>

            <!-- Customer Information -->
            <div class="form-section">
                <h5>Customer Information</h5>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="john@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Company (optional)</label>
                        <input type="text" class="form-control" placeholder="Company Name">
                    </div>
                </form>
            </div>

            <!-- Payment Details -->
            <div class="form-section">
                <h5>Payment Information</h5>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Cardholder Name</label>
                        <input type="text" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" placeholder="•••• •••• •••• ••••">
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Expiry (MM/YY)</label>
                            <input type="text" class="form-control" placeholder="MM/YY">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CVC</label>
                            <input type="text" class="form-control" placeholder="CVC">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Country</label>
                            <select class="form-select">
                                <option>Nigeria</option>
                                <option>United States</option>
                                <option>Others</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Coupon Code -->
            <div class="form-section">
                <h5>Discount Code</h5>
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Enter coupon code">
                    <button class="btn btn-outline-primary" type="button">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Column: Order Summary -->
    <div class="col-lg-4">
        <div class="checkout-card p-4 sidebar-summary">
            <h5 class="mb-3">Order Summary</h5>
            <ul class="list-unstyled mb-4">
                <li class="d-flex justify-content-between">
                    <span>AI Ultimate (1 yr)</span>
                    <span><strong>$300</strong></span>
                </li>
                <li class="d-flex justify-content-between">
                    <span>Discount</span>
                    <span class="text-success">– $0</span>
                </li>
                <li class="border-top pt-2 d-flex justify-content-between">
                    <span>Total</span>
                    <span><strong>$300</strong></span>
                </li>
            </ul>
            <button class="btn btn-primary w-100 mb-2">Complete Purchase</button>
            <small class="text-muted">You will be redirected to secure payment provider.</small>
        </div>
    </div>

</div>
