<app-page-header icon="forum" action="Communication"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'messages') {
  <app-messages [embedded]="true" />
} @else if (tab() === 'announcements') {
  <app-announcements [embedded]="true" />
}
