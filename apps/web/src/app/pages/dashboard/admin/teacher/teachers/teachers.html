<app-page-header icon="supervisor_account" action="Teachers & Staff">
  <app-learno-button routerLink="/admin/teachers/new" text="Add Staff" icon="add" />
</app-page-header>

<app-learno-modal [modalId]="'edit_teacher'" modalAction="Edit Teacher" [showBtn]="false">
  <app-edit-student-form
    [select]="selected()"
    modalForm
    (submitted)="handleSuccessSubmit($event)"
  />
</app-learno-modal>

<app-data-grid
  endpoint="/backend/school/teachers"
  [columns]="columns"
  [filters]="filterDefs"
  [actions]="['edit', 'delete']"
  searchPlaceholder="Search teachers…"
  emptyMessage="No staff yet. Click “Add Staff” to add one."
  (edit)="onEdit($event)"
/>
