<app-user-intro>
  <div class="d-flex align-items-xl-center justify-content-xl-between flex-xl-row flex-column">
    <div class="mb-3 mb-xl-0">
      <h1 class="h3 fw-bold mb-1">Welcome Back, {{ user()?.user?.firstName }}</h1>
      <p class="mb-0">Have a good day at work.</p>
    </div>
    <p class="mb-0 d-inline-flex align-items-center">
      <span class="material-symbols-outlined me-1 fs-6">calendar_today</span>{{ getTodayDate | date: 'fullDate' }}
    </p>
  </div>
</app-user-intro>

<div class="row mb-8">
  <div class="col-12 col-md-6 col-xxl-3 mb-4 mb-xxl-0">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card" >
      <app-stat-card link="/admin/students"  label="Students" [value]="studentsCount" icon="local_library"  />
    </app-skeleton-loader>
  </div>
  <div class="col-12 col-md-6 col-xxl-3 mb-4 mb-xxl-0">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card link="/admin/teachers" label="Teachers" [value]="teachersCount" icon="supervisor_account" />
    </app-skeleton-loader>
  </div>

  <div class="col-12 col-md-6 col-xxl-3  mb-4 mb-md-0">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card link="/admin/academics/subjects" label="subject" [value]="subjectsCount" icon="subject" />
    </app-skeleton-loader>

  </div>
  <div class="col-12 col-md-6 col-xxl-3">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card  label="class" [value]="classesCount" icon="book" />
      </app-skeleton-loader>
  </div>
</div>
