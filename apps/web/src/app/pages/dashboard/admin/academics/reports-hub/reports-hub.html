<app-page-header icon="insights" action="Reports & Report Cards"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'insights') {
  <app-insights [embedded]="true" />
} @else if (tab() === 'analytics') {
  <app-analytics [embedded]="true" />
} @else if (tab() === 'report') {
  <app-school-report [embedded]="true" />
} @else if (tab() === 'cards') {
  <app-report-cards [embedded]="true" />
}
