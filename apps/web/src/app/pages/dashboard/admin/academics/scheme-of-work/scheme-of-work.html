@if (!embedded()) {
  <app-page-header icon="calendar_month" action="Scheme of Work">
    <app-learno-button text="Add Week" icon="add" data-bs-toggle="modal" data-bs-target="#add_week" (clicked)="onAdd()"/>
  </app-page-header>
} @else {
  <div class="d-flex justify-content-end mb-3">
    <app-learno-button text="Add Week" icon="add" data-bs-toggle="modal" data-bs-target="#add_week" (clicked)="onAdd()"/>
  </div>
}

<div class="card border-0 shadow-sm mb-4"><div class="card-body d-flex gap-2 py-3 align-items-start">
  <app-icon name="info" [size]="18" class="text-success flex-shrink-0 mt-1" />
  <div class="small text-body-secondary">
    <span class="fw-semibold text-body">What this is for.</span> The Scheme of Work is your term-by-term teaching plan: for each class, set which topic is taught in which week. It keeps teaching on schedule and aligned across teachers, and it feeds Scheme Coverage and the Curriculum Map.
  </div>
</div></div>

<app-learno-modal [modalId]="'add_week'" [modalAction]="selectScheme() ? 'Edit Week' : 'Add Week'" [showBtn]="false">
  <app-scheme-form
    modalForm
    [select]="selectScheme()"
    [classes]="classes()"
    [subjects]="subjects()"
    [terms]="terms()"
    [topics]="topics()"
    [teachers]="teachers()"
    (submitted)="handleSuccessSubmit($event)"
  />
</app-learno-modal>

<app-data-grid
  endpoint="/backend/school/scheme-of-work"
  [columns]="columns"
  [filters]="filterDefs()"
  [actions]="['edit', 'delete']"
  searchPlaceholder="Search objectives…"
  emptyMessage="No scheme yet. Click “Add Week” to plan the term."
  (edit)="onEdit($event)"
/>
