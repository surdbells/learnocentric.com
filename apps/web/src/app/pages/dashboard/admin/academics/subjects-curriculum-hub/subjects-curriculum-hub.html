<app-page-header icon="subject" action="Subjects & Curriculum"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'subjects') {
  <app-subjects [embedded]="true" />
} @else if (tab() === 'topics') {
  <app-topics [embedded]="true" />
} @else if (tab() === 'lessons') {
  <app-lesson-content [embedded]="true" />
} @else if (tab() === 'packs') {
  <app-delivery-pack-detail [embedded]="true" />
} @else if (tab() === 'scheme') {
  <app-scheme-of-work [embedded]="true" />
} @else if (tab() === 'coverage') {
  <app-scheme-detail [embedded]="true" />
} @else if (tab() === 'map') {
  <app-curriculum-map [embedded]="true" />
} @else if (tab() === 'approvals') {
  <app-approval-queue [embedded]="true" />
}
