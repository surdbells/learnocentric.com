<app-page-header icon="groups" action="Classes & Learners"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'classes') {
  <app-classes-learners [embedded]="true" />
} @else if (tab() === 'students') {
  <app-students [embedded]="true" />
} @else if (tab() === 'enrollment') {
  <app-enrollment [embedded]="true" />
}
