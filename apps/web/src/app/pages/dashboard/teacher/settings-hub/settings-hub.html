<app-page-header icon="settings" action="Settings"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'profile') {
  <app-teacher-profile [embedded]="true" />
} @else if (tab() === 'settings') {
  <app-teacher-settings [embedded]="true" />
}
