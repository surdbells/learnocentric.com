<app-page-header icon="grading" action="Assessments & Gradebooks"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'assessments') {
  <app-assessments [embedded]="true" />
} @else if (tab() === 'questions') {
  <app-question-bank [embedded]="true" />
} @else if (tab() === 'worksheets') {
  <app-worksheets [embedded]="true" />
} @else if (tab() === 'portfolio') {
  <app-portfolio [embedded]="true" />
} @else if (tab() === 'submissions') {
  <app-submissions-inbox [embedded]="true" />
} @else if (tab() === 'gradebook') {
  <app-gradebook [embedded]="true" />
}
