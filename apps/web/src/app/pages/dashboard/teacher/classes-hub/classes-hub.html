<app-page-header icon="group" action="My Classes"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'classes') {
  <app-my-classes [embedded]="true" />
} @else if (tab() === 'learners') {
  <app-student [embedded]="true" />
}
