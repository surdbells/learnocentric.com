<app-page-header icon="insights" action="Progress & Feedback"></app-page-header>

<app-tab-bar class="d-block mb-3" [tabs]="tabs()" [active]="tab()" (activeChange)="tab.set($event)" />

@if (tab() === 'progress') {
  <app-progress-report [embedded]="true" />
} @else if (tab() === 'feedback') {
  <app-my-feedback [embedded]="true" />
}
