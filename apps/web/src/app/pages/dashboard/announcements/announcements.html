<app-page-header icon="campaign" action="Announcements">
  @if (canPost()) {
    <button type="button" class="btn btn-primary btn-sm" (click)="composing.set(!composing())">
      <app-icon name="add" [size]="18" class="me-1" /> New announcement
    </button>
  }
</app-page-header>

@if (composing()) {
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <h6 class="fw-semibold mb-3">Post an announcement</h6>
      <div class="row">
        <div class="col-lg-8 mb-3">
          <label class="form-label" for="a_title">Title</label>
          <input id="a_title" class="form-control" [ngModel]="form().title" (ngModelChange)="updateForm({title: $event})"/>
        </div>
        <div class="col-lg-4 mb-3">
          <label class="form-label" for="a_aud">Audience</label>
          <select id="a_aud" class="form-select" [ngModel]="form().audience" (ngModelChange)="updateForm({audience: $event})">
            @for (a of audiences; track a) { <option [value]="a">{{ titleCase(a) }}</option> }
          </select>
        </div>
        <div class="col-12 mb-3">
          <label class="form-label" for="a_body">Message</label>
          <textarea id="a_body" class="form-control" rows="4" [ngModel]="form().body" (ngModelChange)="updateForm({body: $event})"></textarea>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" [disabled]="busy()" (click)="post()">Post</button>
        <button class="btn btn-light" [disabled]="busy()" (click)="composing.set(false)">Cancel</button>
      </div>
    </div>
  </div>
}

@if (loading()) {
  <div class="text-body-secondary p-4">Loading…</div>
} @else if (!items().length) {
  <div class="card border-0 shadow-sm p-5 text-center text-body-secondary">No announcements yet.</div>
} @else {
  <div class="d-flex flex-column gap-3">
    @for (a of items(); track a.id) {
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-2">
            <h6 class="fw-semibold mb-1">{{ a.title }}</h6>
            <span class="badge bg-light text-body-secondary text-capitalize">{{ a.audience }}</span>
          </div>
          <p class="mb-2" style="white-space: pre-wrap;">{{ a.body }}</p>
          <div class="small text-body-secondary">{{ a.author }} · {{ a.created_at | date:'medium' }}</div>
        </div>
      </div>
    }
  </div>
}
