<app-user-intro>
  <div class="d-flex align-items-xl-center justify-content-xl-between flex-xl-row flex-column">
    <div class="mb-3 mb-xl-0">
      <div class="d-flex align-items-center flex-wrap mb-2">
        <h1 class="me-2">Welcome Back, {{ user()?.user?.firstName }}</h1>
      </div>
      <p class="">Super Admin Overview</p>
    </div>
    <p class=""><span class="material-symbols-outlined me-1 fs-6">calendar_today</span>{{ getTodayDate | date }}</p>
  </div>
</app-user-intro>

<div class="row mb-8">
  <div class="col-12 col-md-6 col-xxl-3 mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/institutions'" label="Institutions" [value]="totalInstitutions" icon="domain" />
    </app-skeleton-loader>
  </div>
  <div class="col-12 col-md-6 col-xxl-3 mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/institutions?type=school'" label="Schools" [value]="totalSchools" icon="shield" />
    </app-skeleton-loader>
  </div>
  <div class="col-12 col-md-6 col-xxl-3  mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/institutions?type=tutoring_academy'" label="Academy" [value]="totalTutoringAcademies" icon="supervisor_account" />
    </app-skeleton-loader>
  </div>
  <div class="col-12 col-md-6 col-xxl-3 mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/users'" label="Active Users" [value]="activeUsers" icon="local_library" />
    </app-skeleton-loader>
  </div>

  <div class="col-12 col-md-6 col-xxl-3 mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/subscriptions'" label="Subscriptions" [value]="totalSubscriptions" icon="local_library" />
    </app-skeleton-loader>
  </div>

    <div class="col-12 col-md-6 col-xxl-3 mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/content-library-items'"label="Content" [value]="totalContentLibraryItems" icon="local_library" />
    </app-skeleton-loader>
  </div>

    <div class="col-12 col-md-6 col-xxl-3 mb-4">
    <app-skeleton-loader [isLoading]="isLoading()" variant="card">
      <app-stat-card [link]="'/super-admin/management/content-packages'" label="Content Packeage" [value]="totalContentPackages" icon="local_library" />
    </app-skeleton-loader>
  </div>

</div>
