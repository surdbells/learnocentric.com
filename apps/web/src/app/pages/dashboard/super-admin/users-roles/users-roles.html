<app-page-header icon="group" action="Users & Roles"></app-page-header>

<app-kpi-strip class="d-block mb-4" [items]="kpis()" [cols]="4" />

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div class="input-group input-group-sm" style="max-width: 320px">
    <span class="input-group-text bg-body"><app-icon name="search" [size]="16" /></span>
    <input type="text" class="form-control" placeholder="Search name or email…"
           [(ngModel)]="search" (keyup.enter)="runSearch()" />
    <button type="button" class="btn btn-outline-secondary" (click)="runSearch()">Search</button>
  </div>
  <span class="small text-body-secondary">{{ meta().total || 0 }} users · page {{ meta().page || 1 }} of {{ totalPages() }}</span>
</div>

<app-tab-bar class="d-block mb-3" [tabs]="tabs()" [active]="role()" (activeChange)="setRole($event)" />

<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr class="text-body-secondary small">
          <th>User</th><th>Role</th><th>Institution</th><th>Status</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="4" class="text-center text-body-secondary py-4">Loading…</td></tr>
        } @else if (!rows().length) {
          <tr><td colspan="4" class="text-center text-body-secondary py-4">No users in this view.</td></tr>
        } @else {
          @for (r of rows(); track r.id) {
            <tr>
              <td><app-avatar-cell [name]="fullName(r)" [sub]="r.email" [image]="r.profile_image_url" /></td>
              <td><app-status-badge [value]="r.role_name" [tone]="roleColor(r.role)" /></td>
              <td class="small text-body-secondary">{{ r.institution || '-' }}</td>
              <td><app-status-badge [value]="r.status" [map]="statusMap" /></td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>

<div class="d-flex justify-content-end gap-2 mt-3">
  <button type="button" class="btn btn-sm btn-outline-secondary" [disabled]="page() <= 1 || loading()" (click)="prev()">
    <app-icon name="chevron_left" [size]="16" /> Prev
  </button>
  <button type="button" class="btn btn-sm btn-outline-secondary" [disabled]="page() >= totalPages() || loading()" (click)="next()">
    Next <app-icon name="chevron_right" [size]="16" />
  </button>
</div>
