<app-page-header icon="notifications" action="Notifications">
  @if (unread() > 0) {
    <button type="button" class="btn btn-sm btn-outline-primary" (click)="markAll()">Mark all read</button>
  }
</app-page-header>

@if (loading()) {
  <div class="text-body-secondary p-4">Loading…</div>
} @else if (!items().length) {
  <div class="card border-0 shadow-sm p-5 text-center text-body-secondary">You have no notifications.</div>
} @else {
  <div class="card border-0 shadow-sm">
    <div class="list-group list-group-flush">
      @for (n of items(); track n.id) {
        <button type="button" class="list-group-item list-group-item-action d-flex align-items-start gap-3 py-3"
                [class.n-unread]="!n.read" (click)="open(n)">
          <span class="n-icon bg-{{ color(n.type) }}-subtle text-{{ color(n.type) }}">
            <app-icon [name]="icon(n.type)" />
          </span>
          <span class="flex-grow-1 text-start">
            <span class="d-flex justify-content-between gap-2">
              <span class="fw-semibold">{{ n.title }}</span>
              <span class="small text-body-secondary text-nowrap">{{ n.created_at | date:'MMM d, h:mm a' }}</span>
            </span>
            @if (n.message) { <span class="d-block small text-body-secondary mt-1">{{ n.message }}</span> }
          </span>
          @if (!n.read) { <span class="n-dot"></span> }
        </button>
      }
    </div>
  </div>
}
