<!-- Offcanvas: Dynamic aligned preview [ngStyle]="offcanvasStyles" -->
<div class="offcanvas offcanvas-end" tabindex="-1" [id]="modalId" #offcanvasRef aria-labelledby="productModalLabel">
  <div class="offcanvas-header justify-content-end align-items-end">
    <button #offsetDismiss type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <ng-content></ng-content>
  </div>
</div>
