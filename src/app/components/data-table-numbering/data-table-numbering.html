<div class="row align-items-center">
  @if ((tableData()?.length ?? 0) > 0) {

    <div class="col">
      <p class="text-body-secondary mb-0">{{ currentPage() }} of {{ pages().length }}</p>
    </div>
    <div class="col-auto">
      <nav aria-label="Page navigation">
        <ul class="pagination mb-0">
          <li class="page-item" [class.disabled]="currentPage() === 1">
            <a class="page-link" href="#" aria-label="Previous" (click)="$event.preventDefault(); pageChange.emit(Math.max(1, currentPage() - 1))">
              <span aria-hidden="true">&laquo;</span>
            </a>
          </li>

          @for(p of pages(); track p) {
            <li class="page-item" [class.active]="currentPage() === p">
              <a class="page-link" href="#" (click)="$event.preventDefault(); pageChange.emit(p)">{{ p }}</a>
            </li>
          }

          <li class="page-item" [class.disabled]="currentPage() >= pages().length">
            <a class="page-link" href="#" aria-label="Next" (click)="$event.preventDefault(); pageChange.emit(Math.min(pages().length, currentPage() + 1))">
              <span aria-hidden="true">&raquo;</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  }
</div>
