<a
  [id]="'preview-btn-' + routine()?.id"
   data-bs-toggle="offcanvas" data-bs-target="#productModal" aria-controls="productModal" (click)="preview.emit({ row: routine(), anchorSelector: '#' + ('preview-btn-' + routine()?.id) })"
>
  <div class="border me-3  rounded p-3 mb-4">
    <p class="d-flex align-items-center text-nowrap mb-1 text-muted"><i class="ti ti-clock me-1"></i>{{getTime}}</p>
    <p class="">Subject : {{routine()?.subject_name}}</p>
    <div class="rounded p-1 mt-3">
      <a routerLink="" class="text-muted d-flex align-items-center">
        <!--            <span class="avatar avatar-sm me-2"></span>-->
        {{tag()}}
      </a>
    </div>
  </div>
</a>
