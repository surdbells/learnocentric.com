<form (submit)="onSubmit()" data-select2-id="84" [formGroup]="formGroup" >
  <div class="modal-body" data-select2-id="83">
    <div class="row" data-select2-id="82">

      <div class="col-lg-6">
        <div class="mb-3"  learnoInput inputType="text" id="lesson_name" label="Lesson Name" [formControlName]="'lesson_name'" > </div>
      </div>

      <div class="col-lg-6" data-select2-id="94">
        <div class="mb-3" learnoSelect id="Classroom" label="Class" [formControlName]="'classroom'"  [options]="[
                    {label: 'Class 1', value: 'Monday'},
                    {label: 'Class 2', value: 'Tuesday'},
                    {label: 'Class 3', value: 'Wednesday'},
                    {label: 'Class 4', value: 'Thursday'},
                    {label: 'Class 5', value: 'Friday'},
        ]"> </div>
      </div>
      <div class="col-lg-6" data-select2-id="81">
        <div class="mb-3" learnoSelect id="subject" label="Subject" [formControlName]="'subject'"  [options]="[
                    {label: 'Class 1', value: 'Monday'},
                    {label: 'Class 2', value: 'Tuesday'},
                    {label: 'Class 3', value: 'Wednesday'},
                    {label: 'Class 4', value: 'Thursday'},
                    {label: 'Class 5', value: 'Friday'},
        ]"> </div>
      </div>

      <div class="col-lg-6" data-select2-id="81">
        <div class="mb-3" learnoSelect id="term" label="term" [formControlName]="'term'"  [options]="[
                    {label: 'Class 1', value: 'Monday'},
                    {label: 'Class 2', value: 'Tuesday'},
                    {label: 'Class 3', value: 'Wednesday'},
                    {label: 'Class 4', value: 'Thursday'},
                    {label: 'Class 5', value: 'Friday'},
        ]"> </div>
      </div>



      <div class="col-lg-6">
        <div class="mb-3">
          <label for="file" class="form-label">Upload Resource</label>
          <input class="form-control" id="file" type="file" (change)="onFileChange($event)" />
        </div>
      </div>

    </div>
  </div>
  <div class="modal-footer">
    <a href="#" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
    <button type="submit" class="btn btn-primary">{{action()}}</button>
  </div>
</form>
