
<form (submit)="!isEdit() ? onSubmit(): onEdit()" [formGroup]="form" >
  <div class="modal-body" data-select2-id="83">
    <div class="row" data-select2-id="82">

      <div class="col-lg-4" data-select2-id="94">
        <div class="mb-3" learnoSelect placeHolder="Fees" id="fees" label="Fees" [formControlName]="'feeStructureId'"  [options]="fees()"> </div>
      </div>
      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="number" [formControlName]="'amount'" id="amount" label="Amount"></div>
      </div>

      <div class="col-lg-4" data-select2-id="81">
        <div class="mb-3" learnoSelect placeHolder="payment Method" id="paymentMethod" label="Payment Method" [formControlName]="'paymentMethod'"  [options]="paymentMethods"> </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <a #closebtn class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="'Submit'" />
  </div>
</form>
