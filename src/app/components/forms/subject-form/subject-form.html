<form (submit)="!isEdit() ? onSubmit(): onEdit()" [formGroup]="form" >
  <div class="modal-body" data-select2-id="83">
    <div class="row" data-select2-id="82">


      <div class="col-lg-6" data-select2-id="94">
        <div learnoInput class="mb-4" [label]="'Subject name'" [inputType]="'text'" [id]="'name'" [formControlName]="'name'" ></div>
      </div>
      <div class="col-lg-6" data-select2-id="94">
        <div learnoInput class="mb-4" [label]="'Subject Code'" [inputType]="'text'" [id]="'code'" [formControlName]="'code'" ></div>
      </div>

      <div class="col-lg-12">
        <div learnoInput class="mb-4" [label]="'Description'" [inputType]="'text'" [id]="'description'" [formControlName]="'description'" ></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <a #closebtn class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="'Submit'" />
  </div>
</form>
