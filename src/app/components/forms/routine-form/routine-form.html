<app-loader [isLoading]="isLoading()" />

<form (submit)="onSubmit()"  [formGroup]="form" >
    <div class="modal-body" data-select2-id="83">
        <div class="row" data-select2-id="82">

            <div class="col-lg-4" data-select2-id="94">
                <div class="mb-3" learnoSelect id="Classroom" label="Class" [formControlName]="'classId'"  [options]="classes()"> </div>
            </div>
            <div class="col-lg-4" data-select2-id="81">
                <div class="mb-3" learnoSelect id="subject" label="Subject" [formControlName]="'subjectId'"  [options]="subjects()"> </div>
            </div>
            <div class="col-lg-4" data-select2-id="81">
                <div class="mb-3" learnoSelect id="teacher" label="Teacher" [formControlName]="'teacherId'"  [options]="teachers()"> </div>
            </div>
            <div class="col-lg-4" data-select2-id="81">
                <div class="mb-3" learnoSelect id="day" label="Day" [formControlName]="'dayOfWeek'"  [options]="days()"> </div></div>
            <div class="col-lg-4">
                <div class="mb-3" learnoInput inputType="text" [formControlName]="'startTime'" id="startHour" label="Start Time"></div>
            </div>
            <div class="col-lg-4">
                <div class="mb-3" learnoInput inputType="text" [formControlName]="'endTime'" id="startMinute" label="Start Minute"></div>
            </div>
            <div class="col-lg-4">
                <div class="mb-3" learnoInput inputType="text" [formControlName]="'room'" id="room" label="Room"></div>
            </div>

        </div>
    </div>
    <div class="modal-footer">
        <a href="#" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
        <button type="submit" class="btn btn-primary">Add Time Table</button>
    </div>
</form>
