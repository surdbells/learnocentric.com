
<form (submit)="!isEdit() ? onSubmit(): onEdit()"  [formGroup]="form" >
  <div class="modal-body" data-select2-id="83">
    <div class="row" data-select2-id="82">

      <div class="col-lg-4" data-select2-id="94">
        <div class="mb-3" learnoSelect id="Classroom" label="Class" [formControlName]="'classId'"  [options]="classes()"> </div>
      </div>
      <div class="col-lg-4" data-select2-id="81">
        <div class="mb-3" learnoSelect id="subject" label="Subject" [formControlName]="'subjectId'"  [options]="subjects()"> </div>
      </div>
      <div class="col-lg-4" data-select2-id="81">
        <div class="mb-3" learnoSelect id="teacher" label="Student" [formControlName]="'studentId'"  [options]="students()"> </div>
      </div>

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'marksObtained'" id="marksObtained" label="Mark Obtained"></div>
      </div>
      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'totalMarks'" id="totalMarks" label="Total Marks"></div>
      </div>
      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="text" [formControlName]="'examName'" id="examName" label="Exam Name"></div>
      </div>

      <div class="col-lg-4">
        <div class="mb-3" learnoInput inputType="date" [formControlName]="'examDate'" id="examDate" label="Exam Date"></div>
      </div>

      <div class="col-lg-12">
        <label class="form-label" for="remark">Remark</label>
        <textarea [formControlName]="'remarks'" class="form-control" rows="3"></textarea>
      </div>


    </div>
  </div>
  <div class="modal-footer">
    <a #closebtn class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
    <app-learno-button [isLoading]="isLoading()" [text]="'Submit'" />
  </div>
</form>
