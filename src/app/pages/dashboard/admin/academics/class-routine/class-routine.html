    <app-learno-modal [modalId]="'add_time_table'" [modalAction]="'Add Time Table'" >
      <app-routine-form modalForm />

  }
</app-page-header>

              <app-routine-card />
              <app-routine-card />
              <app-routine-card />
              <app-routine-card />
              <app-routine-card />
              <app-routine-card />
              <app-routine-card />

            </div>
          }
        </div>
      </app-dashboard-card>
    </div>
</div>
