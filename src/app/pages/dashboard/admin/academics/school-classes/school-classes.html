<app-learno-offset [anchorSelector]="anchorSelector()" [modalId]="'productModal'" (closeOffset)="handleCloseOffset()">
  @if(selectedClass()) {
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center justify-content-between mb-4">
          <div class="col-auto">
            <div class="avatar avatar-xl rounded text-primary">
              <span class="material-symbols-outlined scale-125">visibility</span>
              <!--              <i class="fs-2" data-duoicon="receipt"></i>-->
            </div>
          </div>
          <div class="col-auto">
            <p class="text-end text-body-secondary mb-0">
              Name: <span class="text-body">{{ selectedClass()?.name }} </span><br />
              Level: <span class="text-body">{{ selectedClass()?.grade_level }}</span>
            </p>
          </div>
        </div>
        <div class="list-group mb-4">
          <div class="list-group-item bg-body">
            <div class="row">
              <div class="col">Name</div>
              <div class="col-auto">{{ selectedClass()?.name }}</div>
            </div>
          </div>
          <div class="list-group-item bg-body">
            <div class="row">
              <div class="col">Grade Level</div>
              <div class="col-auto">{{ selectedClass()?.grade_level }}</div>
            </div>
          </div>
          <div class="list-group-item bg-body">
            <div class="row">
              <div class="col">Academic Year</div>
              <div class="col-auto">{{ selectedClass()?.academic_year }}</div>
            </div>
          </div>
          <div class="list-group-item bg-body">
            <div class="row">
              <div class="col">Section</div>
              <div class="col-auto">{{ selectedClass()?.section }}</div>
            </div>
          </div>
        </div>
        <!--        <p class="text-body-secondary small mb-0">Previewing fee structure. Click Download to export.</p>-->
      </div>

      <div class="card-footer">

        <div class="d-flex justify-content-end">
          <app-learno-button text="Edit" class="me-2" data-bs-toggle="modal" [attr.data-bs-target]="`#add_class`" />
          <app-learno-button text="Delete" (clicked)="deleteClass()" btnColor="danger" class="me-2" [isLoading]="isLoading()" />
        </div>

      </div>
    </div>
  }

</app-learno-offset>

<app-page-header icon="book" action="Classes" >
  <app-learno-modal [modalId]="'add_class'" [modalAction]="'Add Class'" >
    <app-school-class-form
      action="Add Class"
      modalForm
      [select]="selectedClass()"
      (submitted)="handleSuccessSubmit($event)"
    />
  </app-learno-modal>
<!--  <app-learno-button (clicked)="clickhandker()" [text]="'Add'" />-->
</app-page-header>

<app-table-search
  (search)="onSearch($event)"


/>
<app-skeleton-loader [isLoading]="isLoading()" variant="table" [rows]="5" [columns]="4">
  <app-data-table
    [tableHeads]="['Class Name', 'Level']"
    [dataFields]="['name', 'grade_level', 'id', 'institution_id']"  [tableRows]="filterClasses()"
    (preview)="onPreview($event)"
  />
</app-skeleton-loader>
