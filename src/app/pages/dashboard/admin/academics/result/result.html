<app-learno-offset [anchorSelector]="anchorSelector()" [modalId]="'productModal'" (closeOffset)="handleCloseOffset()">
  @if(selectedStudent()) {
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center justify-content-between mb-4">
          <div class="col-auto">
            <div class="avatar avatar-xl rounded text-primary">
              <i class="fs-2" data-duoicon="receipt"></i>
            </div>
          </div>
          <div class="col-auto">
            <p class="text-end text-body-secondary mb-0">
              Name: <span class="text-body">{{ selectedStudent()?.first_name }} {{ selectedStudent()?.last_name }}</span><br />
              <!-- Class: <span class="text-body">{{ selectedStudent()?.class_name }}</span> -->
            </p>
          </div>
        </div>
        <div class="list-group mb-4">
          @for (res of selectedStudent()?.results; track res.id) {
            <div class="list-group-item bg-body">
              <div class="row align-items-center">
                <div class="col">
                  <div class="fw-medium">{{ res.subject_name }}</div>
                  <div class="text-body-secondary small">Score: {{ res.marks_obtained }}/{{ res.total_marks }}</div>
                </div>
                <div class="col-auto d-flex">
                  <app-learno-button text="Edit" (clicked)="editResult(res)" class="me-2" data-bs-toggle="modal" [attr.data-bs-target]="`#add_result`" />
                  <app-learno-button text="Delete" (clicked)="deleteResult(res)" btnColor="danger" class="me-2" [isLoading]="isLoading()" />
                </div>
              </div>
            </div>
          }
        </div>
        <!--        <p class="text-body-secondary small mb-0">Previewing fee structure. Click Download to export.</p>-->
      </div>

    </div>
  }

</app-learno-offset>

<app-page-header icon="local_library" action="Grade Report">

  <app-learno-modal [modalId]="'add_result'" [modalAction]="'Add Result'" >
    <app-result-form
      modalForm
      [classes]="classes()"
      [subjects]="subjects()"
      [students]="filterStudents()"
      [select]="selectedResult()"
      (submitted)="handleSuccessSubmit($event)"
      (classChange)="onClassChange($event)"
    />
  </app-learno-modal>
</app-page-header>

<!-- Page content -->
<div class="row">
    <div class="col-12">
        <app-table-search
          (search)="onSearch($event)"
          (filter)="onFilter($event, 'class')"
          [filterKeys]="['Classes']"
          [filterValues]="[classes()]"
        />
      <app-skeleton-loader [isLoading]="isLoading()" variant="table" [rows]="5" [columns]="4">
        <app-data-table
          [tableHeads]="['First Name', 'Last Name', 'Results Count']"
          [tableRows]="studentRows()"
          [dataFields]="['first_name', 'last_name', 'result_count', 'id']"
          (preview)="onPreview($event)"
        />
      </app-skeleton-loader>

      <app-data-table-numbering [tableData]="studentRows()" />
    </div>
</div>
