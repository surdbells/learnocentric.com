<app-loader [isLoading]="isLoading()" />

<app-page-header icon="library_books" action="E-Library" >

  @if(userRole == "admin") {
    <app-learno-modal [modalId]="'add_e_library'" [modalAction]="'Add E-Library'" >
      <app-e-library-form [action]="'Add E-Library'" modalForm [classes]="classes()" [subjects]="subjects()" />
    </app-learno-modal>
  }
<!--  <app-learno-button (clicked)="clickhandker()" [text]="'Add'" />-->
</app-page-header>

<app-table-search />
<app-data-table
  [tableHeads]="['Title', 'Subject', 'Class']"
  [dataFields]="['title', 'subject_name', 'class_name', 'id']"
  [tableRows]="books()"
/>

<app-data-table-numbering [tableData]="books()" />
