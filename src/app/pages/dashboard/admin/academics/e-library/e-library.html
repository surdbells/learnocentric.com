<app-page-header icon="library_books" action="E-Library" >

  @if(userRole == "admin" || userRole == "tutor_admin" || userRole == "teacher") {
    <app-learno-modal [modalId]="'add_e_library'" [modalAction]="'Add E-Library'" >
      <app-e-library-form
        [action]="'Add E-Library'"
        modalForm [classes]="classes()" [subjects]="subjects()"
        (submitted)="handleSuccessSubmit($event)"
      />
    </app-learno-modal>
  }
<!--  <app-learno-button (clicked)="clickhandker()" [text]="'Add'" />-->
</app-page-header>

<app-table-search title="E-Library" />
<app-skeleton-loader [isLoading]="isLoading()" variant="table" [rows]="5" [columns]="4">
  <app-data-table
    [tableHeads]="['Title', 'Subject', 'Class']"
    [dataFields]="['title', 'subject_name', 'class_name', 'id']"
    [tableRows]="books()"
    (preview)="onPreview($event)"
  />
</app-skeleton-loader>

<app-data-table-numbering [tableData]="books()" />
