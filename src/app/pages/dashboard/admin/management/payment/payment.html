<app-learno-offset [anchorSelector]="anchorSelector()" [modalId]="'productModal'" (closeOffset)="handleCloseOffset()">
  @if(selectedStudent()) {
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center justify-content-between mb-4">
          <div class="col-auto">
            <div class="avatar avatar-xl rounded text-primary">
              <i class="fs-2" data-duoicon="receipt"></i>
            </div>
          </div>
          <div class="col-auto">
            <p class="text-end text-body-secondary mb-0">
              Name: <span class="text-body">{{ selectedStudent()?.first_name }} {{ selectedStudent()?.last_name }}</span><br />
              Class: <span class="text-body">{{ selectedStudent()?.class_name }}</span>
            </p>
          </div>
        </div>

        <h6 class="mb-3">Payments</h6>
        <app-skeleton-loader [isLoading]="isLoading()" variant="card" >
          <div class="list-group mb-2">
            @for (p of payments(); track p.id) {
              <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                      data-bs-toggle="modal" [attr.data-bs-target]="'#update_transaction'" (click)="onSelectPayment(p)">
                <div>
                  <div class="fw-semibold">{{ p.fee_name || p.name || 'Payment' }}</div>
                  <small class="text-body-secondary">ID: {{ p.id }} • {{ p.payment_date | date }}</small>
                </div>
                <span class="badge" [class]="'bg-' + (p.status?.toLowerCase().includes('complete') ? 'success' : 'danger') + '-subtle text-' + (p.status?.toLowerCase().includes('complete') ? 'success' : 'danger')">
                {{ p.status || '—' }}
              </span>
              </button>
            }
          </div>
        </app-skeleton-loader>
      </div>
    </div>
  }
</app-learno-offset>

<app-page-header icon="payments" action="Payments">
  <app-learno-modal [modalId]="'update_transaction'" [modalAction]="'Update Transaction'">
    <form (submit)="$event.preventDefault(); submitTransactionUpdate();" modalForm >
      <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Payment ID</label>
            <input type="text" class="form-control" [value]="selectedPayment()?.id" readonly />
          </div>
          <div class="mb-3">
            <label class="form-label">Transaction ID</label>
            <input type="text" class="form-control" [value]="transactionId()" (input)="transactionId.set($any($event.target).value)" placeholder="Enter transaction reference" />
          </div>
          <div class="d-flex justify-content-end">
            <a #closebtn class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</a>
            <app-learno-button [isLoading]="isLoading()" [text]="'Submit'" />
          </div>
      </div>

    </form>
  </app-learno-modal>
</app-page-header>

<!-- Student list -->
<div class="row">
  <div class="col-12">
    <app-table-search title="student(s)" (search)="onSearch($event)" />
    <app-data-table
      [tableHeads]="['Email', 'Firstname', 'Lastname', 'Class', 'Status']"
      [dataFields]="['email', 'first_name', 'last_name', 'class_name', 'status', 'id']"
      [tableRows]="filterEnrollments()"
      (preview)="onPreviewStudent($event)"
    />
  </div>
</div>

<app-data-table-numbering [tableData]="filterEnrollments()" />
