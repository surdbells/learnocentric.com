
<div class="d-flex flex-column flex-root border vh-100 justify-content-center">
  <!--begin::Authentication - Sign-in -->

  <div class="d-flex flex-column flex-column-fluid bgi-position-y-bottom position-x-center bgi-no-repeat bgi-size-contain bgi-attachment-fixed" style="background-size1: 100% 50%; background-image: url(assets/media/svg/illustrations/progress.svg)">

    <!--begin::Content-->
    <div class="d-flex flex-center flex-column flex-column-fluid p-10 pb-lg-20">
      <div class="w-75 w-400px rounded shadow-sm p-10 p-lg-5 mx-auto">
        <div class="row">
          <div class="col-md-12 col-lg-6 col-xl-6 col-sm-12 d-none d-lg-block">
            <img style="border-radius: 12px;" class="img-fluid h-100 object-fit-cover" src="/images/pictureoverlay.png" />
          </div>
          <div class="col-md-12 col-lg-6 col-xl-6 col-sm-12">
            <div class="form-form-wrap">

              <div class="form-container">

                <div class="form-content">
                  <h1 class="">Sign In</h1>
                  <p class="">Log in to your account to continue.</p>
                  <!--begin::Form-->
                  <form [formGroup]="form" (submit)="login()"  class="text-left">
                    <div class="form">
                      <div id="username-field" class="field-wrapper input">
                        <label class="text-uppercase text-primary font-weight-bolder" for="email">USERNAME</label>
                        <input id="email" name="email" formControlName="email" type="text" class="form-control" placeholder="Username">
                      </div>
                      <div class="mt-5"></div>
                      <div id="password-field" class="field-wrapper input mb-2">
                        <div class="d-flex justify-content-between">
                          <label class="text-uppercase text-primary font-weight-bolder" for="password">PASSWORD</label>
                        </div>
                        <input id="password" name="password" type="password" formControlName="password" class="form-control" placeholder="Password">
                      </div>
                      <div class="mt-4"></div>
                      <div class="d-grid gap-2">
                        <app-learno-button text="SIGN IN" [isLoading]="isLoading()" />
<!--                        <button name="public_login" type="submit" class="btn btn-primary" value="">SIGN IN</button>-->
                      </div>
                      <div class="mt-3"></div>


                    </div>
                  </form>
                  <!--end::Form-->

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!--end::Wrapper-->
    </div>
    <!--end::Content-->
    <!--begin::Footer-->
    <div class="d-flex flex-center flex-column-auto p-10">

    </div>
    <!--end::Footer-->
  </div>
  <!--end::Authentication - Sign-in-->
</div>
