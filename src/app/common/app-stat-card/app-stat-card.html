<div class="card h-100  justify-content-center bg-body-tertiary cursor-pointer" [routerLink]="link()">
    <div class="card-body d-flex flex-column justify-content-center">
        <div class="row">
          <div class="col">
            <!-- Heading -->
            <h4 class="fs-sm fw-normal text-body-secondary mb-1">{{ label() }}</h4>

            <!-- Text -->
            <div class="fs-4 fw-semibold">{{value()}}</div>
          </div>
          <div class="col-auto">
            <!-- Avatar -->
            <div class="avatar avatar-lg bg-body text-success">
              <span class="material-symbols-outlined fs-4">{{icon()}}</span>
            </div>
          </div>
        </div>
    </div>
</div>
