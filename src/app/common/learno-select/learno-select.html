<label class="form-label" for="{{id()}}">{{label()}}</label>
@if (searchable()) {
  <div class="position-relative">
    <button
      type="button"
      class="form-select text-start"
      id="{{id()}}"
      (click)="toggleDropdown()"
      [disabled]="disabled() || cvaDisabled"
    >
      {{ selectedLabel() || (multiple() ? 'Select one or more ' + placeHolder() : 'Please select ' + placeHolder()) }}
    </button>

    @if (isOpen()) {
      <div class="position-absolute top-100 start-0 w-100 border rounded bg-body shadow-sm mt-1 option-holder">
        <input
          type="text"
          class="form-control border-0 border-bottom"
          [placeholder]="searchPlaceholder()"
          (input)="onSearchChange($event)"
          [disabled]="disabled() || cvaDisabled"
        />
        <div class="list-group" style="max-height: 240px; overflow: auto;">
          @for(option of filteredOptions(); track option.value) {
            <button type="button" class="list-group-item list-group-item-action"
                    (click)="selectOption(option.value)"
                    [class.active]="multiple() ? selectedValues().includes(option.value) : selectedValue() === option.value">
              {{ option.label }}
            </button>
          }
          @empty {
            <div class="list-group-item text-muted">No results</div>
          }
        </div>
      </div>
    }
  </div>
  <!-- Hidden native select to keep form integration intact -->
  <select
      class="form-select d-none"
      (change)="onSelectChange($event)"
      (blur)="onBlur()"
      [disabled]="disabled() || cvaDisabled"
      [multiple]="multiple()"
  >
      <option value="">Please select an item</option>
      @for(option of options(); track option.value) {
          <option [value]="option.value">{{option.label}}</option>
      }
  </select>
} @else {
  <select
      class="form-select"
      id="{{id()}}"
      (change)="onSelectChange($event)"
      (blur)="onBlur()"
      [disabled]="disabled() || cvaDisabled"
      [multiple]="multiple()"
  >
      <option value="">Please select an item</option>
      @for(option of options(); track option.value) {
          <option [value]="option.value">{{option.label}}</option>
      }
  </select>
}
