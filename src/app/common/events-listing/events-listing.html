<div class="event-scroll">
  @for (schedule of schedules(); track schedules) {
    <!-- Event Item -->
    <div class="border-start border-danger border-3 shadow-sm p-3 mb-3">
      <div class="d-flex align-items-center mb-3 py-4 border-bottom">
                    <span class="avatar p-1 me-2 bg-danger-transparent flex-shrink-0">
                        <i class="material-symbols-outlined fs-3">groups</i>
                    </span>
        <div class="flex-fill">
          <h6 class="mb-1">Vacation Meeting</h6>
          <p class="d-flex align-items-center mb-0"><i class="mdi mdi-calendar me-2"></i>07 July 2024 - 07 July 2024</p>
        </div>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <p class="mb-0"><i class="ti ti-clock me-1"></i>09:10 AM - 10:50 PM</p>
      </div>
    </div>
    <!-- /Event Item -->
  }

</div>
