services:
  postgres:
    image: postgres:16-alpine
    container_name: learno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learno
      POSTGRES_PASSWORD: learno_secret
      POSTGRES_DB: learnocentric
    ports:
      # Host 5433 -> container 5432 (5432 is used by another local project).
      - "5433:5432"
    volumes:
      - learno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learno -d learnocentric"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional DB UI — start with:  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learno-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@learno.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  learno_pgdata:
